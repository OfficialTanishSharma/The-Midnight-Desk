<html lang="en">
<head>
<meta charset="utf-8">

<title>The Midnight Desk — Three Cases</title>
<style>
:root{--paper:#d8cfb7;--ink:#28241d;--thread:#951d21;--lamp-x:62%;--lamp-y:28%}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#080504;color:#eadfc6;font-family:Georgia,"Times New Roman",serif;user-select:none}
button{font:inherit}.game{height:100%;position:relative;isolation:isolate;overflow:hidden;background:#190b06}.desk{position:absolute;inset:0;overflow:hidden;touch-action:none;background:repeating-linear-gradient(2deg,transparent 0 54px,rgba(8,2,0,.32) 55px 57px,transparent 58px 106px),repeating-linear-gradient(91deg,rgba(255,255,255,.013) 0 2px,transparent 3px 10px),radial-gradient(ellipse at 28% 78%,rgba(89,38,18,.2),transparent 28%),linear-gradient(95deg,#251109,#381a0d 18%,#251007 35%,#3d1c0d 57%,#250f07 77%,#38180b)}.desk:before{content:"";position:absolute;inset:0;opacity:.42;pointer-events:none;background:repeating-linear-gradient(174deg,transparent 0 13px,rgba(0,0,0,.16) 14px,transparent 15px 31px);mix-blend-mode:multiply}
#threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.8))}.clue{position:absolute;z-index:10;cursor:grab;transform:translate3d(var(--x),var(--y),0) rotate(var(--r));will-change:transform;touch-action:none;color:var(--ink);filter:drop-shadow(6px 10px 7px rgba(0,0,0,.58));animation:arrive .46s cubic-bezier(.18,.8,.24,1) both}.clue.dragging{cursor:grabbing;z-index:24;filter:drop-shadow(14px 20px 12px rgba(0,0,0,.5))}.clue.leaving{animation:leave .55s ease-in forwards}@keyframes arrive{from{opacity:0;transform:translate3d(var(--x),calc(var(--y) - 22px),0) rotate(calc(var(--r) - 2deg)) scale(.95)}to{opacity:1;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(1)}}@keyframes leave{to{opacity:0;transform:translate3d(var(--x),calc(var(--y) + 28px),0) rotate(calc(var(--r) + 3deg)) scale(.96)}}

.polaroid{width:205px;padding:12px 12px 38px;background:#d8d2c6;clip-path:polygon(1% 1%,98% 0,100% 96%,78% 98%,55% 97%,34% 100%,2% 98%)}.photo{height:140px;position:relative;overflow:hidden;background:var(--scene,linear-gradient(157deg,#202b2c 0 43%,#101313 44%));box-shadow:inset 0 0 22px #000}.photo:after{content:attr(data-time);position:absolute;right:7px;bottom:6px;color:#b86d54;font:12px monospace;text-shadow:0 0 5px #d55}.silhouette:before{content:"";position:absolute;width:70px;height:112px;left:68px;top:25px;background:#050707;clip-path:polygon(32% 0,67% 0,73% 20%,89% 35%,85% 72%,100% 100%,0 100%,14% 69%,10% 37%,27% 20%)}.car:before{content:"";position:absolute;left:22px;right:18px;bottom:23px;height:44px;background:#080909;clip-path:polygon(0 50%,17% 38%,30% 3%,72% 0,88% 37%,100% 48%,96% 87%,7% 88%)}.window:before{content:"";position:absolute;inset:16px 25px 12px;background:linear-gradient(90deg,#161d1c 0 46%,#4e503c 47% 51%,#101514 52%);border:7px solid #090b0a}.caption{text-align:center;margin-top:10px;color:#302a22;font:16px "Comic Sans MS",cursive;transform:rotate(-2deg)}
.brief{width:280px;min-height:205px;padding:30px 26px;background:#d7c58f;background-image:linear-gradient(90deg,transparent 0 25px,rgba(132,38,32,.2) 26px 27px,transparent 28px),repeating-linear-gradient(0deg,transparent 0 25px,rgba(49,81,103,.12) 26px 27px);clip-path:polygon(2% 0,99% 2%,98% 20%,100% 38%,98% 57%,100% 78%,98% 100%,78% 98%,60% 100%,39% 98%,18% 100%,0 98%,2% 75%,0 52%,2% 27%)}.brief:after{content:"BRIEFING";position:absolute;right:17px;top:11px;color:#8b292a;border:2px solid #8b292a;padding:2px 5px;font:700 10px monospace;transform:rotate(4deg)}
.pin{position:absolute;top:-7px;left:50%;width:24px;height:24px;border:0;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 37% 31%,#ef8983 0 9%,#aa2928 18% 48%,#5a1012 65%,#21080a 100%);box-shadow:1px 3px 3px #3b160f;cursor:crosshair;z-index:4}.pin:after{content:"";position:absolute;width:8px;height:7px;background:#160606;border-radius:50%;left:8px;top:8px;opacity:.52}.pin:focus-visible{outline:3px solid #f1d481;outline-offset:3px}
.tape{position:absolute;z-index:13;width:190px;height:112px;border-radius:7px;transform:translate3d(var(--x),var(--y),0) rotate(5deg);background:linear-gradient(#3b332b,#15120f 11%,#27221d 87%,#100e0c);border:2px solid #090807;box-shadow:8px 11px 12px #090403;color:#c8b99b;cursor:pointer;touch-action:none;will-change:transform}.tape .label{position:absolute;inset:14px 17px 28px;background:#b5a98c;color:#332d23;padding:7px 10px;text-align:center;font:11px/1 monospace;letter-spacing:.14em}.reel{position:absolute;top:30px;width:31px;height:31px;border:6px dotted #24201a;border-radius:50%;background:#d6c9aa;box-shadow:0 0 0 4px #171411}.reel.a{left:27px}.reel.b{right:27px}.tape.playing .reel{animation:spin 1s linear infinite}.tape .audio{position:absolute;right:10px;bottom:6px;font:10px monospace;color:#a7926d}.tape.playing .audio{color:#e3b15c;text-shadow:0 0 8px #e3b15c}@keyframes spin{to{transform:rotate(360deg)}}.tape:focus-visible{outline:3px solid #f1d481;outline-offset:4px}
.coffee{position:absolute;width:142px;height:142px;border:11px solid rgba(78,31,13,.22);border-radius:50%;transform:scaleY(.72) rotate(-12deg);box-shadow:inset 0 0 0 3px rgba(46,20,10,.1);pointer-events:none}.scratch{position:absolute;width:210px;height:2px;background:rgba(17,6,3,.38);transform:rotate(-12deg);pointer-events:none;box-shadow:0 3px rgba(255,255,255,.025)}
.lamp{position:absolute;inset:0;z-index:35;pointer-events:none;background:radial-gradient(ellipse 63% 74% at var(--lamp-x) var(--lamp-y),rgba(255,220,143,.17),rgba(255,205,110,.075) 37%,rgba(7,4,2,.28) 70%,rgba(3,2,1,.75));mix-blend-mode:screen}.vignette{position:absolute;inset:0;z-index:36;pointer-events:none;box-shadow:inset 0 0 180px 76px rgba(0,0,0,.7)}
.hud{position:absolute;z-index:50;left:24px;top:20px;pointer-events:none;text-shadow:0 2px 8px #000}.hud h1{margin:0;font-size:24px;letter-spacing:.2em;font-weight:400}.hud p{margin:5px 0 0;color:#aa9877;font:11px/1.4 "Courier New",monospace;letter-spacing:.1em}.status{position:absolute;z-index:50;left:24px;bottom:17px;color:#c1ae88;font:11px monospace;letter-spacing:.08em;text-shadow:0 1px 5px #000}.case-tab{position:absolute;z-index:50;right:25px;top:24px;color:#c8b58e;font:12px "Courier New",monospace;letter-spacing:.12em;text-align:right;text-shadow:0 2px 5px #000}.case-tab span{display:block;color:#7f6c4d;margin-top:4px;font-size:10px}
.stamp{position:absolute;z-index:70;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-7deg) scale(2.3);padding:10px 18px;border:7px double #9b2429;color:#9b2429;font:900 42px/1 "Courier New",monospace;letter-spacing:.08em;background:rgba(199,175,132,.2);text-shadow:1px 1px rgba(57,7,8,.35);box-shadow:0 0 0 2px rgba(119,24,26,.8);opacity:0;pointer-events:none}.stamp.show{animation:stamp .95s cubic-bezier(.15,.8,.25,1) forwards}@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(2.3)}38%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(.92)}55%{transform:translate(-50%,-50%) rotate(-7deg) scale(1.04)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}}
.ending{position:absolute;z-index:80;inset:0;display:grid;place-items:center;background:rgba(8,4,2,.74);opacity:0;pointer-events:none;transition:opacity .8s}.ending.show{opacity:1;pointer-events:auto}.ending-note{width:min(520px,84vw);padding:42px 48px;background:#d2c5a5;color:#272119;transform:rotate(-1deg);filter:drop-shadow(10px 15px 16px #000);clip-path:polygon(1% 1%,98% 0,100% 96%,85% 99%,62% 98%,42% 100%,21% 98%,0 100%,2% 73%,0 49%,2% 23%)}.ending-note h2{font:700 26px "Courier New",monospace;letter-spacing:.12em;margin:0 0 18px}.ending-note p{font:17px/1.6 "Comic Sans MS",cursive}.restart{min-width:44px;min-height:44px;border:2px solid #6f2023;background:transparent;color:#6f2023;font:700 12px "Courier New",monospace;letter-spacing:.12em;cursor:pointer;padding:10px 16px}
@media(max-width:780px){.desk{width:100%;height:100%}.hud h1{font-size:17px}.hud p{max-width:230px;font-size:9px}.case-tab{right:15px;top:88px}.stamp{font-size:27px}.clue{scale:.76;transform-origin:top left}.tape{scale:.76;transform-origin:top left}}
@media(prefers-reduced-motion:reduce){.clue,.clue.leaving,.stamp.show{animation-duration:.01ms}.tape.playing .reel{animation:none}.ending{transition:none}}

<body>
<main class="game" id="game" aria-label="The Midnight Desk detective game">
<section class="desk" id="desk" aria-label="Investigation workspace"><canvas id="threads"></canvas><div class="coffee" style="left:45%;top:59%"></div><div class="scratch" style="left:57%;top:52%"></div><button class="tape" id="tape" style="--x:72vw;--y:70vh" aria-pressed="false" aria-label="Play cassette static"><span class="label">EVIDENCE TAPE<span class="reel a"></span><span class="reel b"></span></span><span class="audio">▶ SILENT</span></button></section>
<div class="lamp"></div><div class="vignette"></div>
<header class="hud"><h1>THE MIDNIGHT DESK</h1><p>DRAG EVIDENCE · PULL THREAD FROM RED PINS</p></header>
<div class="case-tab" id="caseTab"></div><div class="status" id="status" aria-live="polite"></div><div class="stamp" id="stamp">CASE CLOSED</div>
<section class="ending" id="ending"><div class="ending-note"><h2>ALL FILES CLOSED</h2><p>Three knots, three truths. The station is quiet again—but the clock on Platform Four has just begun to move backward.</p><button class="restart" id="restart">REOPEN FILES</button></div></section>
</main>
<script>
(()=>{'use strict';
const CASES=[
 {code:'0317',title:'The Stopped Clock',objective:'The station clock froze at midnight. Connect the evidence that proves where the missing seventeen minutes went.',required:[['clock','watch'],['watch','photo']],items:[
  {id:'brief',type:'brief',x:7,y:18,r:-4,title:'Case briefing',html:'<p>The station clock stopped at midnight, yet a photograph was taken at 03:17.</p><p>Find the object that carries the missing time, then thread the sequence together.</p>'},
  {id:'clock',type:'file',x:29,y:57,r:2,title:'Station clock stops',mast:'THE EVENING SIGNAL · OCT 17',html:'<p>For the third night, Platform Four’s clock stopped precisely at twelve. A porter heard a bell beneath the tracks.</p><span class="evidence-mark">MIDNIGHT</span>'},
  {id:'watch',type:'paper',x:38,y:15,r:-2,title:'Property Ledger',html:'<p>Silver pocket watch recovered from locker 317.</p><p class="type">Hands fixed at 03:00. Back plate scratched: +17.</p>'},
  {id:'photo',type:'polaroid',x:66,y:17,r:4,caption:'platform four — 03:17',photo:'silhouette',time:'03:17'},
  {id:'decoy',type:'paper',x:69,y:47,r:5,title:'Porter’s Note',html:'<p>Boiler pressure normal. West tunnel locked all night.</p><p>Someone left coffee by the signal box.</p>'}]},
 {code:'0904',title:'The Vanishing Courier',objective:'A courier disappeared between the depot and the river. Link the route, vehicle, and false alibi.',required:[['route','receipt'],['receipt','car']],items:[
  {id:'brief',type:'brief',x:7,y:18,r:-3,title:'Case briefing',html:'<p>The courier vanished after leaving Depot Nine.</p><p>A fuel receipt contradicts the driver’s route. Connect the route to the receipt, then to the vehicle.</p>'},
  {id:'route',type:'paper',x:31,y:16,r:2,title:'Courier Route',html:'<p class="type">22:10 — Depot Nine<br>22:35 — North Bridge<br>23:00 — River Gate</p><p>Driver reports no detours.</p>'},
  {id:'receipt',type:'file',x:32,y:57,r:-2,title:'Fuel after midnight',mast:'SOUTH QUAY SERVICE',html:'<p>Petrol purchased at 00:09. Pump 4. Vehicle plate ends 71B. South Quay is six miles off route.</p><span class="evidence-mark">PAID CASH</span>'},
  {id:'car',type:'polaroid',x:64,y:18,r:-5,caption:'south quay / plate 71B',photo:'car',time:'00:12'},
  {id:'alibi',type:'paper',x:68,y:53,r:4,title:'Driver Statement',html:'<p>“I returned directly to the depot before eleven.”</p><p class="type"><span class="redact">SIGNED</span> / R. VOSS</p>'}]},
 {code:'1129',title:'The Room Without a Door',objective:'A sealed room held an impossible witness. Prove how the voice crossed the wall.',required:[['blueprint','vent'],['vent','tapeclue']],items:[
  {id:'brief',type:'brief',x:7,y:18,r:-4,title:'Final briefing',html:'<p>A voice was recorded inside a room sealed for twenty years.</p><p>Trace the hidden passage from the plan to the sound, then to the recording.</p>'},
  {id:'blueprint',type:'paper',x:29,y:15,r:2,title:'Signal Room Plan',html:'<p class="type">WALL 12B / cavity: 18 cm<br>Air duct terminates below desk.</p><p>Original doorway bricked, 1956.</p>'},
  {id:'vent',type:'file',x:29,y:56,r:-1,title:'Dust disturbed',mast:'FORENSIC NOTE · ROOM 12B',html:'<p>Fresh fibers found in the ventilation grille. Resonance test carries speech from the archive room.</p><span class="evidence-mark">COTTON / RED</span>'},
  {id:'tapeclue',type:'polaroid',x:64,y:16,r:5,caption:'recorder beside the vent',photo:'window',time:'01:29'},
  {id:'memo',type:'paper',x:68,y:53,r:-4,title:'Archive Memo',html:'<p>Night clerk reports humming pipes.</p><p>No key exists for Room 12B.</p>'}]}
];
const desk=document.querySelector('#desk'),canvas=document.querySelector('#threads'),ctx=canvas.getContext('2d',{alpha:true}),tape=document.querySelector('#tape'),stamp=document.querySelector('#stamp'),status=document.querySelector('#status'),caseTab=document.querySelector('#caseTab'),ending=document.querySelector('#ending');
let caseIndex=0,links=[],activeLink=null,clues=[],states=new Map(),z=20,dpr=1,dirty=true,locked=false,audio=null,hiss=null;
const edgeKey=(a,b)=>[a,b].sort().join('|');
function itemHTML(item){const pin=`<button class="pin" aria-label="Connect ${item.title||item.caption}"></button>`;if(item.type==='polaroid')return `<article class="clue polaroid" data-id="${item.id}" style="--x:${item.x}vw;--y:${item.y}vh;--r:${item.r}deg" tabindex="0">${pin}<div class="photo ${item.photo}" data-time="${item.time}" aria-label="Evidence photograph"></div><div class="caption">${item.caption}</div></article>`;return `<article class="clue ${item.type}" data-id="${item.id}" style="--x:${item.x}vw;--y:${item.y}vh;--r:${item.r}deg" tabindex="0">${pin}${item.mast?`<div class="mast">${item.mast}</div>`:''}<h2>${item.title}</h2>${item.html}</article>`}
function loadCase(index){locked=false;links=[];activeLink=null;dirty=true;const old=[...desk.querySelectorAll('.clue')];old.forEach(e=>e.remove());const data=CASES[index];desk.insertAdjacentHTML('beforeend',data.items.map(itemHTML).join(''));clues=[...desk.querySelectorAll('.clue')];states=new Map();caseTab.innerHTML=`FILE ${data.code} · ${data.title}<span>CASE ${index+1} OF ${CASES.length}</span>`;status.textContent=`OBJECTIVE / ${data.objective}`;clues.forEach((el,i)=>{el.style.animationDelay=`${i*.07}s`;const x=parseFloat(el.style.getPropertyValue('--x'))/100*desk.clientWidth,y=parseFloat(el.style.getPropertyValue('--y'))/100*desk.clientHeight;states.set(el,{x,y,vx:0,vy:0,raf:0});el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');bindDrag(el);el.querySelector('.pin').addEventListener('pointerdown',beginLink)});resize()}
function resize(){const r=desk.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);dirty=true}
function pinCenter(el){const p=el.querySelector('.pin').getBoundingClientRect(),r=desk.getBoundingClientRect();return{x:p.left+p.width/2-r.left,y:p.top+p.height/2-r.top}}
function path(a,b){const sag=Math.min(48,Math.max(17,Math.hypot(b.x-a.x,b.y-a.y)*.085));return new Path2D(`M${a.x},${a.y} Q${(a.x+b.x)/2},${(a.y+b.y)/2+sag} ${b.x},${b.y}`)}
function thread(a,b){const p=path(a,b);ctx.lineCap='round';ctx.strokeStyle='rgba(20,3,4,.58)';ctx.lineWidth=6;ctx.stroke(p);ctx.strokeStyle='#901b20';ctx.lineWidth=3.5;ctx.stroke(p);ctx.strokeStyle='rgba(238,115,105,.52)';ctx.lineWidth=.7;ctx.stroke(p)}
function render(){if(dirty){ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);links.forEach(l=>thread(pinCenter(l.a),pinCenter(l.b)));if(activeLink)thread(pinCenter(activeLink.a),activeLink.to);dirty=false}requestAnimationFrame(render)}
function apply(el,s){const maxX=Math.max(8,desk.clientWidth-el.offsetWidth-8),maxY=Math.max(8,desk.clientHeight-el.offsetHeight-8);s.x=Math.max(8,Math.min(maxX,s.x));s.y=Math.max(70,Math.min(maxY,s.y));el.style.setProperty('--x',s.x+'px');el.style.setProperty('--y',s.y+'px')}
function bindDrag(el){el.addEventListener('pointerdown',e=>{if(locked||e.target.closest('.pin'))return;e.preventDefault();const s=states.get(el);cancelAnimationFrame(s.raf);el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.style.zIndex=++z;let px=e.clientX,py=e.clientY,pt=performance.now();const move=ev=>{const now=performance.now(),dt=Math.max(8,now-pt),dx=ev.clientX-px,dy=ev.clientY-py;s.x+=dx;s.y+=dy;s.vx=dx/dt*16;s.vy=dy/dt*16;px=ev.clientX;py=ev.clientY;pt=now;apply(el,s);dirty=true};const end=()=>{el.classList.remove('dragging');el.removeEventListener('pointermove',move);inertia(el,s)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',end,{once:true});el.addEventListener('pointercancel',end,{once:true})})}
function inertia(el,s){const tick=()=>{if(locked)return;s.vx*=.89;s.vy*=.89;if(Math.abs(s.vx)+Math.abs(s.vy)<.2)return;s.x+=s.vx;s.y+=s.vy;apply(el,s);dirty=true;s.raf=requestAnimationFrame(tick)};s.raf=requestAnimationFrame(tick)}
function beginLink(e){if(locked)return;e.preventDefault();e.stopPropagation();const pin=e.currentTarget,a=pin.closest('.clue');activeLink={a,to:pinCenter(a)};pin.setPointerCapture(e.pointerId);const move=ev=>{const r=desk.getBoundingClientRect();activeLink.to={x:ev.clientX-r.left,y:ev.clientY-r.top};dirty=true};const end=ev=>{const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.clue');if(hit&&hit!==a){const key=edgeKey(a.dataset.id,hit.dataset.id);if(!links.some(l=>l.key===key)){links.push({a,b:hit,key});softClick();status.textContent=`FILE ${CASES[caseIndex].code} / THREADS: ${links.length}`;checkCase()}}activeLink=null;dirty=true;pin.removeEventListener('pointermove',move)};pin.addEventListener('pointermove',move);pin.addEventListener('pointerup',end,{once:true});pin.addEventListener('pointercancel',end,{once:true})}
function threadHit(clientX,clientY){const r=desk.getBoundingClientRect(),p={x:clientX-r.left,y:clientY-r.top},tolerance=11;for(let i=links.length-1;i>=0;i--){const a=pinCenter(links[i].a),b=pinCenter(links[i].b),sag=Math.min(48,Math.max(17,Math.hypot(b.x-a.x,b.y-a.y)*.085)),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2+sag};let prev=a;for(let n=1;n<=40;n++){const t=n/40,u=1-t,q={x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};const vx=q.x-prev.x,vy=q.y-prev.y,wx=p.x-prev.x,wy=p.y-prev.y,len2=vx*vx+vy*vy,k=len2?Math.max(0,Math.min(1,(wx*vx+wy*vy)/len2)):0,dx=p.x-(prev.x+k*vx),dy=p.y-(prev.y+k*vy);if(dx*dx+dy*dy<=tolerance*tolerance)return i;prev=q}}return-1}
function cutThread(e){if(locked)return false;const i=threadHit(e.clientX,e.clientY);if(i<0)return false;links.splice(i,1);dirty=true;softClick();status.textContent=`FILE ${CASES[caseIndex].code} / THREAD CUT · ${links.length} REMAIN`;return true}
function checkCase(){const need=CASES[caseIndex].required.map(x=>edgeKey(...x));if(need.every(k=>links.some(l=>l.key===k)))closeCase()}
function audioContext(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function softClick(){const a=audioContext(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.setValueAtTime(95,a.currentTime);g.gain.setValueAtTime(.025,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.045);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.05)}
function typewriter(){const a=audioContext();for(let i=0;i<11;i++){const t=a.currentTime+i*.055,buffer=a.createBuffer(1,Math.floor(a.sampleRate*.026),a.sampleRate),d=buffer.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);const src=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.value=i===10?650:1200+Math.random()*700;g.gain.value=i===10?.12:.055;src.connect(filter).connect(g).connect(a.destination);src.start(t)}}
function closeCase(){locked=true;stopHiss();typewriter();stamp.classList.remove('show');void stamp.offsetWidth;stamp.classList.add('show');status.textContent=`FILE ${CASES[caseIndex].code} / SOLVED`;setTimeout(()=>{clues.forEach(e=>e.classList.add('leaving'));stamp.classList.remove('show');setTimeout(()=>{caseIndex++;if(caseIndex<CASES.length)loadCase(caseIndex);else ending.classList.add('show')},520)},2200)}
function startHiss(){const a=audioContext(),length=a.sampleRate*2,buf=a.createBuffer(1,length,a.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<length;i++){const white=Math.random()*2-1;last=last*.94+white*.06;d[i]=last*.55+white*.08}const src=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain();src.buffer=buf;src.loop=true;filter.type='highpass';filter.frequency.value=420;g.gain.value=.11;src.connect(filter).connect(g).connect(a.destination);src.start();hiss={src,g};tape.classList.add('playing');tape.setAttribute('aria-pressed','true');tape.querySelector('.audio').textContent='▰ HISS / PLAYING'}
function stopHiss(){if(hiss){try{hiss.src.stop()}catch{}hiss=null}tape.classList.remove('playing');tape.setAttribute('aria-pressed','false');tape.querySelector('.audio').textContent='▶ SILENT'}
tape.addEventListener('click',()=>hiss?stopHiss():startHiss());
desk.addEventListener('contextmenu',e=>{if(cutThread(e))e.preventDefault()});
desk.addEventListener('dblclick',e=>{if(cutThread(e)){e.preventDefault();e.stopPropagation()}});
document.querySelector('#restart').addEventListener('click',()=>{caseIndex=0;ending.classList.remove('show');loadCase(0)});
window.addEventListener('resize',resize,{passive:true});window.addEventListener('pointermove',e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.documentElement.style.setProperty('--lamp-x',`${56+e.clientX/innerWidth*14}%`);document.documentElement.style.setProperty('--lamp-y',`${22+e.clientY/innerHeight*11}%`)},{passive:true});
loadCase(0);requestAnimationFrame(render);
})();
</script>
</body>
